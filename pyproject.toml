[build-system]
requires = ['setuptools>=68']
build-backend = 'setuptools.build_meta'

[project]
name = 'ctfbot'
version = '0.1.0'
description = 'A tool-driven CTF solving workbench for LLM agents'
readme = 'README.md'
requires-python = '>=3.11'
dependencies = ['textual==8.2.8']

[project.urls]
Repository = 'https://github.com/myj0e/FlagCapturer'
Issues = 'https://github.com/myj0e/FlagCapturer/issues'

[project.scripts]
ctfbot = 'ctfbot.cli.main:main'

[tool.setuptools.packages.find]
where = ['src']

[tool.setuptools]
package-dir = {'' = 'src'}

[tool.setuptools.package-data]
'ctfbot.packs' = ['data/*/pack.yaml', 'data/*/README.md']
